<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Assistant GM baseball">
  <rect width="32" height="32" rx="7" fill="#26624d"/>
  <circle cx="16" cy="16" r="10" fill="#fbfaf5" stroke="#d7d2c0" stroke-width="0.5"/>
  <g fill="none" stroke="#c8442f" stroke-linecap="round">
    <!-- seam base lines -->
